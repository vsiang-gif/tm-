<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>MT采集器</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>MT采集器</h1>
        <p class="dim">在「站点」里勾选要采集的平台和国家，点「打开」进入网页；所有选项改完自动保存，已打开的网页会自动刷新生效。</p>
      </div>
      <span id="ver" class="ver"></span>
    </header>
    <main id="tab-settings">
      <nav class="subtabs" id="groups" aria-label="设置分类"></nav>
      <form id="settings" class="settings" autocomplete="off"></form>
      <p id="saved" class="msg ok" role="status" aria-live="polite"></p>
    </main>
    <script src="launcher.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
