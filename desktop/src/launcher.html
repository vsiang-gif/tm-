<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>MT采集器</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <h1>MT采集器</h1>
        <p class="dim">在「开始采集」里选平台和国家打开网页；所有采集选项都在「采集设置」里，改完自动保存，已打开的网页会自动刷新生效。</p>
      </div>
      <span id="ver" class="ver"></span>
    </header>
    <nav class="tabs" role="tablist" aria-label="主菜单">
      <button type="button" role="tab" data-tab="start" aria-selected="true">开始采集</button>
      <button type="button" role="tab" data-tab="settings" aria-selected="false">采集设置</button>
    </nav>
    <main id="tab-start" role="tabpanel">
      <form id="custom" class="custom">
        <label for="url" class="sr-only">网址</label>
        <input id="url" type="url" placeholder="或粘贴任意 Temu / SHEIN / Etsy / 速卖通 等网址" required />
        <button type="submit">打开</button>
      </form>
      <div id="list" class="list"></div>
      <section class="tip">
        <h2>灵图插件</h2>
        <p class="dim">采集通过的商品需要灵图插件点「采集并同步」。把灵图插件解压到一个文件夹，然后点下面按钮选择该文件夹，之后每次启动都会自动加载。</p>
        <button id="ext" type="button" class="ghost">加载灵图插件（解压目录）</button>
      </section>
    </main>
    <main id="tab-settings" role="tabpanel" hidden>
      <nav class="subtabs" id="groups" aria-label="设置分类"></nav>
      <form id="settings" class="settings" autocomplete="off"></form>
      <p id="saved" class="msg ok" role="status" aria-live="polite"></p>
    </main>
    <script src="launcher.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
