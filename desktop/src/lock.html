<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>爆款图案采集器 - 验证密钥</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="lock">
    <main class="lock-card">
      <div class="mark" aria-hidden="true">T</div>
      <h1>爆款图案采集器</h1>
      <p class="dim">请输入密钥后使用</p>
      <form id="form" autocomplete="off">
        <label for="key" class="sr-only">密钥</label>
        <input id="key" type="password" inputmode="numeric" placeholder="输入密钥" autofocus required />
        <button type="submit" id="submit">进入</button>
      </form>
      <p id="msg" class="msg" role="alert" aria-live="polite"></p>
    </main>
    <script src="lock.js"></script>
  </body>
</html>
