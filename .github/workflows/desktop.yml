name: Desktop EXE

on:
  push:
    paths:
      - 'desktop/**'
      - 'lib/userscript.ts'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Build EXE
        working-directory: desktop
        run: npm run dist

      - name: Publish to release "desktop-latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: MT采集器 Windows 版
          body: 下载 portable.exe 双击即用（首次运行会自动复制一份到桌面「采集」文件夹），或下载 setup.exe 安装（默认安装到桌面「采集」文件夹）。启动需要输入密钥。
          files: desktop/dist/*.exe
          make_latest: true

      - name: Remove older installers from the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $names = gh release view desktop-latest -R ${{ github.repository }} --json assets --jq '.assets[].name'
          foreach ($n in $names) {
            if ($n -like '*.exe' -and $n -notlike "*-$ver-*") {
              gh release delete-asset desktop-latest $n -R ${{ github.repository }} -y
            }
          }
